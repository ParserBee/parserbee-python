[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parserbee"
dynamic = ["version"]
description = "Python client for the ParserBee document extraction API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ParserBee", email = "support@parserbee.com" }]
keywords = ["parserbee", "ocr", "invoice", "pdf", "document extraction", "data extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://parserbee.com"
Documentation = "https://app.parserbee.com/docs"
Source = "https://github.com/ParserBee/parserbee-python"

[tool.hatch.version]
path = "src/parserbee/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/parserbee"]
